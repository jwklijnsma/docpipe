[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docpipe"
dynamic = ["version"]
description = "Multi-agent documentation generator backed by Ollama"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
docpipe = "docpipe.cli:main"

[tool.setuptools.dynamic]
# Single source of truth: the release workflow bumps __version__ only.
version = { attr = "docpipe.__version__" }

[tool.setuptools.packages.find]
include = ["docpipe*"]

[tool.setuptools.package-data]
"docpipe.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
