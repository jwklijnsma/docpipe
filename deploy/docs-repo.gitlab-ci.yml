# Put this in the DOCS repository as .gitlab-ci.yml.
#   * every merge request (including docpipe's) gets a strict MkDocs build,
#     so broken links or nav fail before anyone merges
#   * main is published with GitLab Pages
# Swap the image for your internal mirror if Docker Hub isn't reachable.
default:
  image: python:3.15-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths: [.cache/pip]

.mkdocs:
  before_script:
    - pip install --quiet "mkdocs==1.6.*" "mkdocs-material==9.*" "mkdocs-static-i18n==1.3.*"

build:
  extends: .mkdocs
  stage: test
  script:
    - mkdocs build --strict --site-dir build
  artifacts:
    paths: [build]
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  extends: .mkdocs
  stage: deploy
  script:
    - mkdocs build --strict --site-dir public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
