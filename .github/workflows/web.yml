name: web

# The React UI lives in web/ and is built into docpipe/web/static/, which is
# committed so `pip install` and the Docker image need no Node. This checks the
# committed bundle matches the source; on bot PRs (Renovate, Dependabot) that bump
# web dependencies it rebuilds and pushes the bundle itself.
on:
  pull_request:
    paths: ["web/**", "docpipe/web/static/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", "docpipe/web/static/**", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used to push a rebuilt bundle to a bot's PR branch
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle matches the source
        id: bundle
        working-directory: .
        run: |
          if git diff --quiet -- docpipe/web/static && [ -z "$(git ls-files --others --exclude-standard docpipe/web/static)" ]; then
            echo "Committed bundle is up to date."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            git status --short -- docpipe/web/static
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild for a bot's dependency PR
        if: >-
          steps.bundle.outputs.stale == 'true' && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (contains(fromJSON('["renovate[bot]","dependabot[bot]"]'), github.actor) || startsWith(github.head_ref, 'renovate/'))
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docpipe/web/static
          git commit -m "build(web): rebuild the UI bundle"
          git push
          echo "Pushed a rebuilt bundle to this PR." >> "$GITHUB_STEP_SUMMARY"
      - name: Stale bundle
        if: >-
          steps.bundle.outputs.stale == 'true' && !(github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (contains(fromJSON('["renovate[bot]","dependabot[bot]"]'), github.actor) || startsWith(github.head_ref, 'renovate/')))
        run: |
          echo "::error::docpipe/web/static/ is out of date with web/src. Run 'make web' and commit the result."
          exit 1
