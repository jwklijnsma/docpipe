# docpipe documentation - built with Zensical (https://zensical.org)
#   pip install -r requirements-docs.txt
#   zensical serve            # preview on http://localhost:8000
#   zensical build --strict   # what CI runs
#
# The pages live in documentation/, not docs/: docs/ is docpipe's own default
# output folder (pipeline.output_dir) and is git-ignored.

[project]
site_name = "docpipe"
site_description = "Documentation from Helm charts, Kubernetes manifests, Argo CD and Ansible repos, written by LLM agents on your own Ollama server"
site_url = "https://jwklijnsma.github.io/docpipe/"
repo_url = "https://github.com/jwklijnsma/docpipe"
repo_name = "jwklijnsma/docpipe"
docs_dir = "documentation"
edit_uri = "edit/main/documentation/"
copyright = "docpipe - no code leaves your network"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Install" = "getting-started/install.md" },
    { "Quick start" = "getting-started/quickstart.md" },
  ] },
  { "Use" = [
    { "Generate docs" = "usage/run.md" },
    { "Source types" = "usage/sources.md" },
    { "Dutch and other languages" = "usage/languages.md" },
    { "MkDocs site" = "usage/site.md" },
    { "Publish as a merge request" = "usage/publish.md" },
    { "Previews on merge requests" = "usage/mr-previews.md" },
    { "Web UI" = "usage/web-ui.md" },
  ] },
  { "Deploy" = [
    { "Container and systemd" = "deploy/container.md" },
    { "Scheduled runs" = "deploy/scheduled.md" },
  ] },
  { "Speed and tuning" = "speed.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Reference" = [
    { "Configuration" = "reference/configuration.md" },
    { "Commands" = "reference/cli.md" },
    { "Secrets and security" = "reference/security.md" },
  ] },
  { "Development" = [
    { "Contributing" = "development/contributing.md" },
    { "Releasing" = "development/releasing.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

[project.theme.icon]
logo = "material/file-document-multiple"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "amber"
toggle.icon = "material/weather-night"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "amber"
toggle.icon = "material/weather-sunny"
toggle.name = "Light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets = {}
pymdownx.tabbed.alternate_style = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
